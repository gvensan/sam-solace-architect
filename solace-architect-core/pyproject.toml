[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "solace-architect-core"
version = "0.1.0"
description = "Shared tools, schemas, grounding docs, and default configs for the Solace Architect V2 plugin family"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [
  { name = "Solace Architect Contributors" },
]
keywords = ["solace", "sam", "solace-agent-mesh", "event-driven-architecture"]
dependencies = [
  "pyyaml>=6.0",
  "jinja2>=3.1",
]

[project.optional-dependencies]
weasyprint = ["weasyprint>=60.0"]
test = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[tool.hatch.build.targets.wheel]
packages = ["src/solace_architect_core"]
# Note: configs/, grounding/, and schemas/ are subdirectories of the
# package and ship automatically via `packages` above. Earlier revisions
# also listed them under force-include, which caused duplicate entries
# in the built wheel (visible as `UserWarning: Duplicate name …`).
